<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Mario Running</title>
        <link rel="stylesheet" href="src/css/style.css">
        <link rel = "shortcut icon" href ="src/img/icon-mario.ico">
    </head>

    <body id="telaInicial">
        <audio id="efeitosSonoros" src="./src/audio/puloMario.m4a"></audio>
        <audio id="telaInicialTheme" src="./src/audio/Super Mario World Title Theme.mp3" loop></audio>

        <!--
            .gameStage: ocupa a tela real do dispositivo. Em mobile/tablet
            (< 1280px) ele é rotacionado 90° para simular o modo paisagem.
            A partir de 1280px (desktop), fica sem rotação (já é paisagem).

            .gameWorld: mundo de proporção fixa (16:9) que sempre cobre
            o .gameStage por inteiro (estratégia "cover", como
            background-size: cover), cortando o excedente nas bordas
            quando a proporção da tela real for diferente de 16:9.
            Tudo dentro dele (chão, montanhas, personagens) é posicionado
            em % relativos a essa proporção fixa — por isso a relação
            entre os elementos se mantém idêntica em qualquer resolução.
        -->
        <div class="gameStage">
            <div class="gameWorld">
                <main>
                    <div class="telaInicialNuvensDistantes">
                        <div class="nuvem nuvemPequena nuvemDist1"></div>
                        <div class="nuvem nuvemGrande nuvemDist2"></div>
                        <div class="nuvem nuvemPequena nuvemDist3"></div>
                        <div class="nuvem nuvemGrande nuvemDist4"></div>
                    </div>

                    <div class="telaInicialNuvensTraseiras">
                        <div class="nuvem nuvemGrande nuvemTras1"></div>
                        <div class="nuvem nuvemPequena nuvemTras2"></div>
                        <div class="nuvem nuvemGrande nuvemTras3"></div>
                        <div class="nuvem nuvemPequena nuvemTras4"></div>
                        <div class="nuvem nuvemGrande nuvemTras5"></div>
                        <div class="nuvem nuvemPequena nuvemTras6"></div>
                    </div>

                    <div class="telaInicialLogo"></div>

                    <div class="telaInicialMontanhas">
                        <div class="conjuntoMontanhas"></div>
                        <div class="montanhaSolitaria"></div>
                    </div>

                    <div class="telaInicialLogo"></div>

                    <div class="telaInicialChao"></div>

                    <div class="telaInicialInimigos">
                        <div class="inimigo goomba goomba1"></div>
                        <div class="inimigo goomba goomba2"></div>
                        <div class="inimigo koopa"></div>
                        <div class="inimigo blockhopper"></div>
                    </div>

                    <div class="telaInicialNuvensDianteiras">
                        <div class="nuvem nuvemPequena nuvemFrente1"></div>
                        <div class="nuvem nuvemGrande nuvemFrente2"></div>
                        <div class="nuvem nuvemPequena nuvemFrente3"></div>
                        <div class="nuvem nuvemGrande nuvemFrente4"></div>
                        <div class="nuvem nuvemPequena nuvemFrente5"></div>
                        <div class="nuvem nuvemGrande nuvemFrente6"></div>
                    </div>

                    <button class="telaInicialBotao">Start</button>
                </main>
            </div>

            <article id="campoOptions">
                <img id="options" src="./src/img/guear.png" alt="engrenagem">

                <div class="fundoStatico"></div>

                <section class="menuOptions">
                    <div>
                        <button class="sair">X</button>
                    </div>

                    <article>
                        <div>
                            <button id="botaoVolume" class="optBotao" data-icon-on="iconVolume" data-icon-off="iconSemVolume">
                                <span class="iconVolume"></span>
                            </button>
                            <input type="range" name="volume" id="volumeMusica" class="volume" data-audio="telaInicialTheme" min="0" max="100" value="50">
                        </div>

                        <div>
                            <button id="botaoEfeito" class="optBotao" data-icon-on="iconEfeito" data-icon-off="iconSemEfeito">
                                <span class="iconEfeito"></span>
                            </button>
                            <input type="range" name="volume" id="volumeEfeitos" class="volume" data-audio="efeitosSonoros" min="0" max="100" value="50">
                        </div>
                    </article>
                </section>
            </article>
        </div>
        <script type="module" src="./src/js/main.js"></script>
    </body>
</html>
