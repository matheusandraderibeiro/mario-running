        <!--
            .gameStage: ocupa a tela real do dispositivo. Em mobile/tablet
            (< 1280px) ele é rotacionado 90° para simular o modo paisagem.
            A partir de 1280px (desktop), fica sem rotação (já é paisagem).

            .gameWorld: mundo de proporção fixa (16:9) que sempre cobre
            o .gameStage por inteiro (estratégia "cover", como
            background-size: cover), cortando o excedente nas bordas
            quando a proporção da tela real for diferente de 16:9.
            Tudo dentro dele (chão, montanhas, personagens) é posicionado
            em % relativos a essa proporção fixa — por isso a relação
            entre os elementos se mantém idêntica em qualquer resolução.
        -->
