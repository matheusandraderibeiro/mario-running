<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, git log --onelinemaximum-scale=1.0, user-scalable=no">
        <title>Mario Running</title>
        <link rel="stylesheet" href="src/css/style.css">
        <link rel = "shortcut icon" href ="src/img/icon-mario.ico">
    </head>

    <body id="telaInicial">
        <audio id="telaInicialTheme" src="./src/audio/Super Mario World Title Theme.mp3" loop></audio>
        <main>
            <article id="campoOptions">
                <img id="options" src="./src/img/guear.png" alt="engrenagem">

                <div class="fundoStatico"></div>

                <section class="menuOptions">
                    <div>
                        <button class="sair">X</button>
                    </div>

                    <article>
                        <div>
                            <button id="botaoVolume" class="optBotao"><span class="iconVolume"></span></button>
                           <input type="range" name="volume" id="volumeMusica" class="volume" data-audio="telaInicialTheme" min="0" max="100" value="50">
                        </div>

                        <div>
                            <button id="botaoEfeito" class="optBotao"><span class="iconVolume"></span></button>
                            <input type="range" name="volume" id="volumeEfeitos" class="volume" data-audio="efeitosSonoros" min="0" max="100" value="50">
                        </div>
                    </article>
                </section>
            </article>

            <article class="telaInicialNuvensTraseiras">
                <div>
                    <img class="nuvem n0" src="./src/img/pequena-nuvem.png" alt="Nuvem Pequena" draggable="false">
                    <img class="nuvem n1" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                    <img class="nuvem n2" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                    <img class="nuvem n4" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                </div>
                
                <div>
                    <img class="nuvem n3" src="./src/img/pequena-nuvem.png" alt="Nuvem Pequena" draggable="false">
                    <img class="nuvem n0" src="./src/img/pequena-nuvem.png" alt="Nuvem Pequena" draggable="false">
                    <img class="nuvem n4" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                    <img class="nuvem n1" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                </div>
            </article>

            <div class="telaInicialLogo">
                <img src="./src/img/Logo.png" alt="" draggable="false">
            </div>

            <article class="telaInicialNuvensDianteiras">
                <div>
                    <img class="nuvem n6" src="./src/img/pequena-nuvem.png" alt="Nuvem Pequena" draggable="false">
                    <img class="nuvem n5" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                    <img class="nuvem n7" src="./src/img/pequena-nuvem.png" alt="Nuvem Pequena" draggable="false">
                    <img class="nuvem n8" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                    <img class="nuvem n9" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                </div>

                <div>
                    <img class="nuvem n8" src="./src/img/pequena-nuvem.png" alt="Nuvem Pequena" draggable="false">
                    <img class="nuvem n9" src="./src/img/pequena-nuvem.png" alt="Nuvem Pequena" draggable="false">
                    <img class="nuvem n6" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                    <img class="nuvem n7" src="./src/img/pequena-nuvem.png" alt="Nuvem Pequena" draggable="false">
                    <img class="nuvem n5" src="./src/img/grande-nuvem.png" alt="Nuvem Grande" draggable="false">
                </div>
            </article>

            <article class="telaInicialInimigos">
                <div class="telaInicialkoopas">
                    <img class="koopa" src="./src/img/Koopa.gif" alt="" draggable="false">
                </div>

                <div class="telaInicialGoombas">
                    <img class="goomba" src="./src/img/goomba.gif" alt="goomba 1" draggable="false">
                    <img class="goomba goomba2" src="./src/img/goomba.gif" alt="goomba 2" draggable="false">
                </div>
            </article>
            
            <div class="telaInicialChao">
                <img class="Chao_cenario3" src="./src/img/cenario3.png" alt="chao" draggable="false">
            </div>
            
            <div class="telaInicialMontanhas">
                <img class="conjuntoMontanhas" src="./src/img/conjunto-montanhas.png" alt="" draggable="false">
            </div>

            <div class="telaInicialBotaoContent">
                <button class="telaInicialBotao">Start</button>
            </div>
        </main>
        <script type="module" src="./src/js/main.js"></script>
    </body>
</html>
